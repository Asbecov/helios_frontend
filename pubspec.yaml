name: helios_frontend
description: "Flutter based Helios VPN web app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.10.0
  flutter_bloc: ^9.1.1
  flutter_localization: ^0.4.1
  flutter_telegram_miniapp: ^0.0.12
  get_it: ^9.2.1
  go_router: ^17.3.0
  talker_bloc_logger: ^5.1.17
  talker_dio_logger: ^5.1.17
  talker_flutter: ^5.1.17
  flag: ^7.0.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  eitherx: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  build_runner: ^2.15.0
  retrofit_generator: ^10.2.9

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/

  fonts:
    - family: Roboto_Condensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Italic-VariableFont_wght.ttf
          style: italic
        - asset: assets/fonts/RobotoCondensed-VariableFont_wght.ttf

        
          
